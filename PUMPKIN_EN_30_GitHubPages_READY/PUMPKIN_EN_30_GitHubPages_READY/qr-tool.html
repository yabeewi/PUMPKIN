<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teacher QR Code Tool | Halloween Pumpkin Hunt</title>
  <link rel="stylesheet" href="./css/style.css?v=5.0">
</head>
<body>
  <main class="tool-layout">
    <div class="no-print">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">🧑‍🏫</span>
          <span>Teacher QR Code Tool</span>
        </div>
        <a class="small-link" href="./index.html">Student Home →</a>
      </header>

      <section class="card tool-card">
        <p class="eyebrow">Teacher Only</p>
        <h1 style="font-size: clamp(32px, 6vw, 48px)">Generate 30 Pumpkin QR Codes</h1>
        <p class="lead" style="margin: 0 0 16px">After the website is deployed, enter the public base URL below. Each QR Code will open a pumpkin with its own color, accessory, and personality.</p>

        <div class="tool-controls">
          <input id="baseUrl" type="url" placeholder="https://your-site.example/PUMPKIN">
          <button id="generateQr" class="button-primary" type="button">Generate QR Codes</button>
          <button id="printQr" class="button-secondary" type="button">Print</button>
        </div>
        <p class="tool-status" data-qr-status>Confirm the public website URL, then generate the QR Codes.</p>
      </section>
    </div>

    <section class="qr-output" data-qr-output></section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" integrity="sha512-CNgIRecGo7nphbeZ04Sc13ka07paqdeTu0WR1IM4kNcpmBAUSHSQX0FslNhTDadL4O5SAGapGt4FodqL8My0mA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="./js/config.js?v=5.0"></script>
  <script src="./js/qr-tool.js?v=5.0"></script>
</body>
</html>
